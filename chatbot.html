<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Public Health Chatbot</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="chatbot-body">
    <div class="chat-container">
        <div class="chat-header">
            <h2>Public Health AI Assistant</h2>
            <p>Describe your symptoms for awareness & advisory</p>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                Hello! I am your Public Health Assistant. Please enter your symptoms (e.g., fever, cold, rash) to receive health awareness information.
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your symptoms here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();

            if (userText === "") return;

            // 1. User Message-a Screen-la kaata
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = userText;
            chatBox.appendChild(userDiv);
            
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Real Backend (app.py) Call
            try {
                const response = await fetch('/get_response', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                
                const data = await response.json();
                
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                botDiv.textContent = data.reply;
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                console.error("Error communicating with backend server:", error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
