<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat History - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>
  (function(){
    var theme = localStorage.getItem('healthbot-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div class="top-bar">
    <div class="welcome">🕒 Chat History</div>
    <a href="/dashboard" class="logout-btn">⬅️ Back</a>
</div>

<div class="card" style="max-width:700px;">
    <form method="GET" style="display:flex; gap:10px; margin-bottom:6px;">
        <input type="text" name="q" value="{{ q }}" placeholder="Search your chat history..." style="margin-top:0;">
        <button type="submit" class="btn" style="width:auto; margin-top:0; padding:0 18px;">Search</button>
    </form>

    <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0;">
        <span style="color:var(--ink-soft); font-size:13px;">{{ rows|length }} conversation{{ 's' if rows|length != 1 else '' }} found</span>
        <button onclick="clearHistory()" style="background:var(--coral-tint); color:var(--coral); border:none; border-radius:8px; padding:8px 14px; font-weight:700; font-size:12.5px; cursor:pointer;">🗑️ Clear History</button>
    </div>

    {% for h in rows %}
    <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line);">
        <p style="font-weight:600; color:var(--ink);">🙋 You: {{ h["message"] }}</p>
        <p style="color:var(--ink-soft); font-size:14px; margin-top:4px;">🤖 Bot: {{ h["reply"] }}</p>
        <p style="color:var(--ink-soft); font-size:11.5px; margin-top:4px;">🗓️ {{ h["created_at"] }}</p>
    </div>
    {% else %}
    <p style="color:var(--ink-soft); text-align:center; padding:20px 0;">No chats found.</p>
    {% endfor %}

    <a href="/download-chat-pdf" class="btn" style="text-decoration:none; margin-top:20px;">⬇️ Download Chat as PDF</a>
</div>

<script>
async function clearHistory(){
    if(!confirm('Clear your entire chat history? This cannot be undone.')) return;
    try{
        await fetch('/chat-history/clear', { method: 'POST' });
        window.location.reload();
    }catch(e){
        console.error('Clear failed', e);
    }
}
</script>

</body>
</html>
