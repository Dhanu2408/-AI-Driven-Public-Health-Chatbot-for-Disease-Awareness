<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>
  (function(){
    var theme = localStorage.getItem('healthbot-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div class="top-bar" style="max-width:500px;">
    <div class="welcome">🧑‍⚕️ My Profile</div>
    <a href="/dashboard" class="logout-btn">⬅️ Back</a>
</div>

<div class="card" style="max-width:500px;">
    <form method="POST" action="/profile">
        <label>Name</label>
        <input type="text" value="{{ name }}" disabled>

        <div class="profile-grid">
            <div>
                <label>Age</label>
                <input type="number" name="age" min="0" max="120" value="{{ profile.age if profile else '' }}" placeholder="e.g. 21">
            </div>
            <div>
                <label>Gender</label>
                <select name="gender">
                    <option value="" {% if not profile or not profile.gender %}selected{% endif %}>Select</option>
                    <option value="Male" {% if profile and profile.gender=='Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if profile and profile.gender=='Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if profile and profile.gender=='Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>

        <div class="profile-grid">
            <div>
                <label>Blood Group</label>
                <select name="blood_group">
                    <option value="" {% if not profile or not profile.blood_group %}selected{% endif %}>Select</option>
                    {% for bg in ["A+","A-","B+","B-","O+","O-","AB+","AB-"] %}
                    <option value="{{ bg }}" {% if profile and profile.blood_group==bg %}selected{% endif %}>{{ bg }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Weight (kg)</label>
                <input type="number" step="0.1" name="weight" value="{{ profile.weight if profile else '' }}" placeholder="e.g. 60">
            </div>
        </div>

        <label>Height (cm)</label>
        <input type="number" step="0.1" name="height" value="{{ profile.height if profile else '' }}" placeholder="e.g. 165">

        <button type="submit" class="btn">Save Profile</button>
    </form>
</div>

</body>
</html>
