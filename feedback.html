<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feedback - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>
  (function(){
    var theme = localStorage.getItem('healthbot-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div class="top-bar">
    <div class="welcome">⭐ Feedback</div>
    <a href="/dashboard" class="logout-btn">⬅️ Back</a>
</div>

<div class="card" style="max-width:450px; text-align:center;">
    {% if submitted %}
        <div class="goodbye-icon">🙏</div>
        <h2 style="margin-bottom:10px;">Thank you for your feedback, {{ name }}!</h2>
        <p style="color:var(--ink-soft); margin-bottom:20px;">It helps us make the chatbot better for everyone.</p>
        <a href="/dashboard" class="btn">Back to Dashboard</a>
    {% else %}
        <p style="color:var(--ink-soft); margin-bottom:16px;">How was your experience with the Health Chatbot?</p>
        <form method="POST" id="feedbackForm">
            <label style="text-align:left; display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px;">Full Name</label>
            <input type="text" name="name" value="{{ name }}" placeholder="Your name" required style="margin-bottom:12px;">

            <label style="text-align:left; display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px;">Email</label>
            <input type="email" name="email" value="{{ email }}" placeholder="you@example.com" required style="margin-bottom:12px;">

            <div class="stars" id="stars">
                <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
            </div>
            <input type="hidden" name="rating" id="ratingInput" value="">
            <label style="text-align:left; display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px;">Feedback Message</label>
            <textarea name="comment" placeholder="Share your feedback about the website..." style="height:80px; margin-bottom:10px;" required></textarea>
            <button type="submit" class="btn">Submit Feedback</button>
        </form>
    {% endif %}
</div>

<script>
let selected = 0;
document.querySelectorAll('#stars span').forEach(star=>{
    star.addEventListener('click', ()=>{
        selected = parseInt(star.dataset.v);
        document.getElementById('ratingInput').value = selected;
        document.querySelectorAll('#stars span').forEach(s=>{
            s.classList.toggle('on', parseInt(s.dataset.v) <= selected);
        });
    });
});
const form = document.getElementById('feedbackForm');
if(form){
    form.addEventListener('submit', function(e){
        if(!selected){
            e.preventDefault();
            alert('Please select a star rating before submitting.');
        }
    });
}
</script>

</body>
</html>
