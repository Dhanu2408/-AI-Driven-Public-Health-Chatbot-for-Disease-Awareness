<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<h1 class="title">AI Public Health Chatbot</h1>
<p class="tagline">Disease awareness at your fingertips</p>

<div class="card">
    <div class="tabs">
        <a href="/login" class="active">Login</a>
        <a href="/register">Register</a>
    </div>

    <form method="POST">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <button type="submit" class="btn">Login</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    {% if reset_error %}
    <div class="error">{{ reset_error }}</div>
    {% endif %}
    {% if reset_success %}
    <div class="success">{{ reset_success }}</div>
    {% endif %}

    <p class="footer-link">Don't have an account? <a href="/register">Register</a></p>
    <p class="footer-link"><a href="#" id="forgotToggle">Forgot password?</a></p>

    <div id="forgotBox" style="display:none; text-align:left; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">
        <form method="POST" action="/forgot-password">
            <label>Registered email address</label>
            <input type="email" name="email" placeholder="you@example.com" required>

            <label>New password</label>
            <input type="password" name="new_password" placeholder="Enter a new password" required>

            <button type="submit" class="btn">Reset Password</button>
        </form>
    </div>
</div>

<script>
document.getElementById('forgotToggle').addEventListener('click', function(e){
    e.preventDefault();
    const box = document.getElementById('forgotBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
});
{% if reset_error or reset_success %}
document.getElementById('forgotBox').style.display = 'block';
{% endif %}
</script>

</body>
</html>
