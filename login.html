<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – AI Health Chatbot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-logo">💊</div>
    <h1>AI Public Health Chatbot</h1>
    <p class="sub">Disease awareness at your fingertips</p>

    <div class="login-card">
      <div class="form-tabs">
        <button class="form-tab active"
          onclick="toggleAuth('login', this)">Login</button>
        <button class="form-tab"
          onclick="toggleAuth('register', this)">Register</button>
      </div>

      <div id="login-form">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" />
        </div>
        <button class="btn-primary"
          onclick="window.location='dashboard.html'">
          Login
        </button>
        <p class="form-hint">
          Forgot password? <a href="#">Reset here</a>
        </p>
      </div>

      <div id="register-form" style="display:none;">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Mobile number</label>
          <input type="tel" placeholder="+91 XXXXX XXXXX" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Create a password" />
        </div>
        <button class="btn-primary"
          onclick="window.location='dashboard.html'">
          Create Account
        </button>
      </div>
    </div>
  </div>

  <script>
    function toggleAuth(mode, btn) {
      document.querySelectorAll('.form-tab')
        .forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      if (mode === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
      }
    }
  </script>
</body>
</html>
