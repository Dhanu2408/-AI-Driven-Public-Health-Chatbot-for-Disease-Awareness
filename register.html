<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<h1 class="title">AI Public Health Chatbot</h1>
<p class="tagline">Disease awareness at your fingertips</p>

<div class="card">
    <div class="tabs">
        <a href="/login">Login</a>
        <a href="/register" class="active">Register</a>
    </div>

    <form method="POST">
        <label>Full name</label>
        <input type="text" name="name" placeholder="Your name" required>

        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <label>Mobile number</label>
        <input type="tel" name="mobile" placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" maxlength="10" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>

        <label>Confirm password</label>
        <input type="password" name="confirm_password" placeholder="Re-enter your password" required>

        <button type="submit" class="btn">Register</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <p class="footer-link">Already have an account? <a href="/login">Login</a></p>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e){
    const pw = document.querySelector('input[name="password"]').value;
    const cpw = document.querySelector('input[name="confirm_password"]').value;
    if(pw !== cpw){
        e.preventDefault();
        alert('Password and Confirm Password do not match.');
    }
});
</script>

</body>
</html>
