<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="logo"></div>
<h1 class="title">AI Public Health Chatbot</h1>
<p class="tagline">Disease awareness at your fingertips</p>

<div class="card">
    <div class="tabs">
        <a href="/login">Login</a>
        <a href="/register" class="active">Register</a>
    </div>

    <form method="POST">
        <label>Full name</label>
        <input type="text" name="name" placeholder="Your name" required>

        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>

        <button type="submit" class="btn">Register</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <p class="footer-link">Already have an account? <a href="/login">Login</a></p>
</div>

</body>
</html>
