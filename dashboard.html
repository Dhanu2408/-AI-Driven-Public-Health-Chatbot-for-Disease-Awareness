<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - AI Health Chatbot</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="top-bar">
    <div class="welcome">Welcome, {{ name }} 👋</div>
    <a href="/logout" class="logout-btn">Logout</a>
</div>

<div class="dash-grid">
    <a href="/chatbot" class="dash-card">
        <h3>💬 Chat with AI</h3>
        <p>Describe your symptoms and get instant guidance.</p>
    </a>

    <a href="#" class="dash-card">
        <h3>📊 Disease Info</h3>
        <p>Browse common diseases and prevention tips.</p>
    </a>
</div>

</body>
</html>
